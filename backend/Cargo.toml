[package]
name = "codex-proxy-basispoints-plugin"
version = "0.1.7"
edition = "2024"
license = "Apache-2.0"
publish = false
autotests = false
rust-version = "1.97"

[[test]]
name = "manifest"
path = "tests/manifest.rs"

[dependencies]
base64 = "0.22.1"
gateway-plugin-sdk = { git = "https://github.com/zyycn/codex-proxy-rs.git", rev = "70d1557b55aed871d66dee5db82c2254990d06a6", features = ["io"] }
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tokio = { version = "1.52.3", default-features = false, features = ["io-std", "macros", "rt", "sync", "time"] }
uuid = { version = "1.18.1", features = ["v4"] }
url = "2.5.7"

[dev-dependencies]
tokio = { version = "1.52.3", default-features = false, features = ["io-util"] }

[lints.rust]
warnings = "deny"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = 10 }
redundant_clone = { level = "deny", priority = 9 }
needless_collect = { level = "deny", priority = 8 }

[profile.release]
debug = false
strip = "symbols"
lto = "thin"
codegen-units = 1
panic = "abort"
