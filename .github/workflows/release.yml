name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: x86_64-unknown-linux-gnu
          components: rustfmt, clippy
      - run: npm --prefix worker ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix worker test
      - run: cargo +1.97.0 fmt --manifest-path backend/Cargo.toml -- --check
      - run: cargo +1.97.0 clippy --manifest-path backend/Cargo.toml --all-targets --all-features --locked -- -D warnings
      - run: cargo +1.97.0 test --manifest-path backend/Cargo.toml --locked

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: x86_64-unknown-linux-gnu
          components: rustfmt, clippy
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: worker
        with:
          context: worker
          push: true
          tags: ghcr.io/david1989sky/codex-proxy-basispoints-worker:${{ github.ref_name }}
      - run: cargo +1.97.0 install --locked --git https://github.com/zyycn/codex-proxy-rs.git --rev 70d1557b55aed871d66dee5db82c2254990d06a6 codex-proxy-plugin-cli --root .tools
      - run: WORKER_IMAGE=ghcr.io/david1989sky/codex-proxy-basispoints-worker:${{ github.ref_name }} WORKER_IMAGE_DIGEST=${{ steps.worker.outputs.digest }} PLUGIN_CLI=$PWD/.tools/bin/cpr-plugin bash scripts/package.sh
      - run: |
          test "$(jq -r .workerImageDigest dist/companion-manifest.json)" = "${{ steps.worker.outputs.digest }}"
          test "$(jq -r .pluginVersion dist/companion-manifest.json)" = "${GITHUB_REF_NAME#v}"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
            ops/companion-install.sh
            ops/companion-update.sh
