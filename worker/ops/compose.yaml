services:
  worker:
    image: ${WORKER_IMAGE:?WORKER_IMAGE must be an immutable GHCR image reference}
    container_name: cpr-basispoints-worker
    network_mode: host
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    mem_limit: 512m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required}
      CPR_BASE_URL: http://127.0.0.1:28080
      PORT: '28082'
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'
