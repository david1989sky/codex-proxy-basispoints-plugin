location ^~ /api/admin/twofa/ {
    client_max_body_size 140k;
    client_body_buffer_size 140k;
    access_log off;
    proxy_pass http://127.0.0.1:28082;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 45s;
    proxy_buffering off;
    proxy_request_buffering off;
}

location = / {
    root /opt/cpr-twofa/release/frontend/dist;
    try_files /index.html =404;
    add_header Cache-Control "no-store";
}

location = /index.html {
    root /opt/cpr-twofa/release/frontend/dist;
    add_header Cache-Control "no-store";
}

location ~ ^/(accounts|login|key-usage|proxies|groups|keys|usage|theme|settings|plugins)(/.*)?$ {
    root /opt/cpr-twofa/release/frontend/dist;
    try_files /index.html =404;
    add_header Cache-Control "no-store";
}

location ^~ /assets/ {
    root /opt/cpr-twofa/release/frontend/dist;
    try_files $uri @cpr_original_assets;
}

location @cpr_original_assets {
    proxy_pass http://127.0.0.1:28080;
    proxy_set_header Host $host;
}
