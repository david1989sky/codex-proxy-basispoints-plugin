<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BPS 通道使用情况</title>
    <link rel="stylesheet" href="app.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="page" aria-labelledby="page-title">
      <header class="page-header">
        <div>
          <p class="eyebrow">Basis Points</p>
          <h1 id="page-title">BPS 通道使用情况</h1>
          <p class="lede">查看当前插件进程记录的请求结果。</p>
        </div>
        <button id="refresh" class="refresh-button" type="button">
          <span class="refresh-icon" aria-hidden="true">↻</span>
          <span data-refresh-label>刷新</span>
        </button>
      </header>

      <p id="status" class="status" role="status" aria-live="polite">正在读取统计数据…</p>

      <dl class="stats" aria-label="BPS 请求统计">
        <div class="stat-card stat-card-total">
          <dt>请求总数</dt>
          <dd id="total-requests">—</dd>
        </div>
        <div class="stat-card stat-card-success">
          <dt>成功请求</dt>
          <dd id="successful-requests">—</dd>
        </div>
        <div class="stat-card stat-card-failure">
          <dt>失败请求</dt>
          <dd id="failed-requests">—</dd>
        </div>
        <div class="stat-card stat-card-last">
          <dt>最近请求</dt>
          <dd id="last-request">暂无请求</dd>
        </div>
      </dl>

      <footer class="page-footer">
        <p>最近更新时间：<time id="updated-at">—</time></p>
        <p>统计范围：当前 BPS 插件进程。插件重启、升级或重新加载后计数会清零。</p>
      </footer>
    </main>
  </body>
</html>
